{{- if and .Values.migration.enabled (or (not .Values.maintenance.enabled) .Values.maintenance.runMigration) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rag-store.fullname" . }}-migrate
  labels:
    {{- include "rag-store.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "rag-store.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ default (include "rag-store.fullname" .) .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "rag-store.image" (dict "root" . "image" .Values.searchApi.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python", "-c", "from rag_store.database.migrate import upgrade; import os; upgrade(os.environ['RAG_STORE_DATABASE__URL'])"]
          env:
            - name: RAG_STORE_ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: RAG_STORE_DATABASE__URL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret | required "existingSecret is required for migrations" }}, key: {{ .Values.secretKeys.migratorUrl }}}}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
