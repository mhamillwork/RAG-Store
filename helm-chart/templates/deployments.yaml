{{- $root := . -}}
{{- $components := list "searchApi" "ingestionWorker" "scanner" "mcp" "fileApi" "webGui" "doclingWorker" -}}
{{- range $name := $components }}
{{- $component := index $root.Values $name }}
{{- if $component.enabled }}
{{- if and $component.autoscaling $component.autoscaling.enabled $component.keda $component.keda.enabled }}
{{- fail (printf "%s cannot enable HPA and KEDA at the same time" $name) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-store.fullname" $root }}-{{ $name | kebabcase }}
  labels:
    {{- include "rag-store.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name | kebabcase }}
spec:
  replicas: {{ include "rag-store.replicas" (dict "root" $root "component" $component) }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name | kebabcase }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "rag-store.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name | kebabcase }}
    spec:
      serviceAccountName: {{ default (include "rag-store.fullname" $root) $root.Values.serviceAccount.name }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with (default $root.Values.nodeSelector $component.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $component.topologySpread }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: {{ $name | kebabcase }}
      {{- end }}
      containers:
        - name: {{ $name | kebabcase }}
          image: {{ include "rag-store.image" (dict "root" $root "image" $component.image) }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rag-store.fullname" $root }}-config
          env:
            - name: RAG_STORE_COMPONENT
              value: {{ $component.component | quote }}
            {{- if and $root.Values.existingSecret (ne $component.component "gui") }}
            - name: RAG_STORE_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.existingSecret }}
                  key: {{ if or (eq $component.component "search") (eq $component.component "mcp") }}{{ $root.Values.secretKeys.searchUrl }}{{ else if eq $component.component "files" }}{{ $root.Values.secretKeys.filesUrl }}{{ else }}{{ $root.Values.secretKeys.workerUrl }}{{ end }}
            - name: RAG_STORE_AUTH__JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: {{ $root.Values.secretKeys.jwtSecret }}}}
            - name: RAG_STORE_EMBEDDING__API_KEY
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: {{ $root.Values.secretKeys.embeddingApiKey }}, optional: true}}
            - name: RAG_STORE_RERANKING__API_KEY
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: {{ $root.Values.secretKeys.rerankingApiKey }}, optional: true}}
            - name: RAG_STORE_AUTH__BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: {{ $root.Values.secretKeys.bootstrapAdminPassword }}, optional: true}}
            {{- end }}
          securityContext:
            {{- if $component.securityContext }}
            {{- toYaml $component.securityContext | nindent 12 }}
            {{- else }}
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $component.mountsDocuments }}
            {{- if $root.Values.persistence.global.enabled }}
            - name: global-data
              mountPath: {{ $root.Values.persistence.global.mountPath }}
            {{- end }}
            {{- if $root.Values.persistence.local.enabled }}
            - name: local-data
              mountPath: {{ $root.Values.persistence.local.mountPath }}
            {{- end }}
            {{- end }}
            {{- if and $component.mountsModels $root.Values.persistence.doclingModels.enabled }}
            - name: docling-models
              mountPath: {{ $root.Values.persistence.doclingModels.mountPath }}
              readOnly: true
            {{- end }}
            {{- if eq $name "webGui" }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $component.mountsDocuments }}
        {{- if $root.Values.persistence.global.enabled }}
        - name: global-data
          persistentVolumeClaim:
            claimName: {{ $root.Values.persistence.global.existingClaim | default (printf "%s-global" (include "rag-store.fullname" $root)) }}
        {{- end }}
        {{- if $root.Values.persistence.local.enabled }}
        - name: local-data
          persistentVolumeClaim:
            claimName: {{ $root.Values.persistence.local.existingClaim | default (printf "%s-local" (include "rag-store.fullname" $root)) }}
        {{- end }}
        {{- end }}
        {{- if and $component.mountsModels $root.Values.persistence.doclingModels.enabled }}
        - name: docling-models
          persistentVolumeClaim:
            claimName: {{ $root.Values.persistence.doclingModels.existingClaim | default (printf "%s-docling-models" (include "rag-store.fullname" $root)) }}
        {{- end }}
        {{- if eq $name "webGui" }}
        - name: nginx-config
          configMap:
            name: {{ include "rag-store.fullname" $root }}-gui-nginx
        {{- end }}
{{- end }}
{{- end }}
