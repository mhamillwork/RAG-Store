{{- if .Values.gateway.enabled }}
{{- $parent := .Values.gateway.existingGateway | default (printf "%s-gateway" (include "rag-store.fullname" .)) }}
{{- if not .Values.gateway.existingGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $parent }}
spec:
  gatewayClassName: {{ required "gateway.className is required when creating a Gateway" .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      {{- if .Values.gateway.tls.enabled }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ required "gateway.tls.secretName is required" .Values.gateway.tls.secretName }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rag-store.fullname" . }}
spec:
  parentRefs:
    - name: {{ $parent }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    {{- if . }}
    - {{ . | quote }}
    {{- end }}
    {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1/search}
      backendRefs:
        - name: {{ include "rag-store.fullname" . }}-search-api
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /api/}
      backendRefs:
        - name: {{ include "rag-store.fullname" . }}-file-api
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "rag-store.fullname" . }}-web-gui
          port: 8080
{{- end }}
